<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Painel Meta LivePix</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Nunito', sans-serif;
    background: linear-gradient(180deg, #1e1b4b 0%, #0f0d2e 100%);
    min-height: 100vh;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  .header {
    text-align: center;
    margin-bottom: 25px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 900;
    color: #d946ef;
    text-shadow: 0 0 15px rgba(217,70,239,0.5);
    margin-bottom: 5px;
  }

  .header p {
    font-size: 13px;
    color: #a78bfa;
  }

  .current-display {
    background: linear-gradient(145deg, rgba(168,85,247,0.2), rgba(217,70,239,0.1));
    border: 2px solid #a855f7;
    border-radius: 20px;
    padding: 20px 40px;
    text-align: center;
    margin-bottom: 25px;
    box-shadow: 0 0 30px rgba(168,85,247,0.2);
    width: 100%;
    max-width: 350px;
  }

  .current-display .label {
    font-size: 12px;
    color: #c084fc;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  .current-display .value {
    font-size: 42px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,255,255,0.3);
  }

  .current-display .meta-info {
    font-size: 13px;
    color: #fbbf24;
    margin-top: 5px;
  }

  .progress-ring {
    width: 120px;
    height: 120px;
    margin: 0 auto 25px;
    position: relative;
  }

  .progress-ring svg {
    transform: rotate(-90deg);
  }

  .progress-ring circle {
    fill: none;
    stroke-width: 8;
  }

  .progress-ring .bg {
    stroke: rgba(168,85,247,0.2);
  }

  .progress-ring .progress {
    stroke: url(#gradient);
    stroke-linecap: round;
    transition: stroke-dashoffset 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 5px rgba(217,70,239,0.5));
  }

  .progress-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 20px;
    font-weight: 900;
    color: #d946ef;
  }

  .quick-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: 100%;
    max-width: 350px;
    margin-bottom: 20px;
  }

  .quick-btn {
    background: linear-gradient(145deg, #7c3aed, #a855f7);
    border: none;
    border-radius: 15px;
    padding: 15px 5px;
    color: #fff;
    font-size: 16px;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(124,58,237,0.3);
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .quick-btn:active {
    transform: scale(0.95);
    box-shadow: 0 2px 8px rgba(124,58,237,0.2);
  }

  .quick-btn::after {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    transition: width 0.3s, height 0.3s;
  }

  .quick-btn:active::after {
    width: 100px;
    height: 100px;
  }

  .quick-btn.gold {
    background: linear-gradient(145deg, #f59e0b, #fbbf24);
    box-shadow: 0 4px 15px rgba(245,158,11,0.3);
    color: #1e1b4b;
  }

  .custom-section {
    width: 100%;
    max-width: 350px;
    background: rgba(168,85,247,0.1);
    border: 1px solid rgba(168,85,247,0.3);
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 15px;
  }

  .custom-section h3 {
    font-size: 13px;
    color: #c084fc;
    margin-bottom: 10px;
    text-align: center;
  }

  .custom-input-group {
    display: flex;
    gap: 8px;
  }

  .custom-input-group input {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid #a855f7;
    border-radius: 10px;
    padding: 12px 15px;
    color: #fff;
    font-size: 16px;
    font-family: 'Nunito', sans-serif;
    outline: none;
  }

  .custom-input-group input::placeholder {
    color: #7c3aed;
  }

  .custom-input-group button {
    background: linear-gradient(145deg, #d946ef, #a855f7);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    color: #fff;
    font-size: 14px;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    white-space: nowrap;
  }

  .custom-input-group button:active {
    transform: scale(0.95);
  }

  .action-buttons {
    display: flex;
    gap: 10px;
    width: 100%;
    max-width: 350px;
  }

  .action-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 900;
    font-family: 'Nunito', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .action-btn.reset {
    background: linear-gradient(145deg, #ef4444, #dc2626);
    color: #fff;
    box-shadow: 0 4px 15px rgba(239,68,68,0.3);
  }

  .action-btn.reset:active {
    transform: scale(0.95);
  }

  .action-btn.undo {
    background: linear-gradient(145deg, #6366f1, #4f46e5);
    color: #fff;
    box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }

  .action-btn.undo:active {
    transform: scale(0.95);
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: linear-gradient(145deg, #10b981, #059669);
    color: #fff;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 5px 20px rgba(16,185,129,0.4);
    opacity: 0;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .cat-icon {
    font-size: 30px;
    margin-bottom: 5px;
  }

  .history-section {
    width: 100%;
    max-width: 350px;
    margin-top: 15px;
    background: rgba(168,85,247,0.05);
    border-radius: 15px;
    padding: 12px;
    max-height: 150px;
    overflow-y: auto;
  }

  .history-section h3 {
    font-size: 12px;
    color: #c084fc;
    margin-bottom: 8px;
    text-align: center;
  }

  .history-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 10px;
    background: rgba(168,85,247,0.1);
    border-radius: 8px;
    margin-bottom: 5px;
    font-size: 13px;
  }

  .history-item .time {
    color: #a78bfa;
    font-size: 11px;
  }

  .history-item .amount {
    color: #34d399;
    font-weight: 700;
  }
</style>
</head>
<body>

<svg width="0" height="0">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#d946ef"/>
    </linearGradient>
  </defs>
</svg>

<div class="header">
  <div class="cat-icon">🐱</div>
  <h1>Painel da Meta</h1>
  <p>Atualize o valor recebido na live</p>
</div>

<div class="current-display">
  <div class="label">Valor Atual</div>
  <div class="value">R$ <span id="currentDisplay">0,00</span></div>
  <div class="meta-info">Meta: R$ 50,00</div>
</div>

<div class="progress-ring">
  <svg width="120" height="120">
    <circle class="bg" cx="60" cy="60" r="52"/>
    <circle class="progress" cx="60" cy="60" r="52" 
      stroke-dasharray="326.73" stroke-dashoffset="326.73" id="progressCircle"/>
  </svg>
  <div class="progress-text" id="progressText">0%</div>
</div>

<div class="quick-buttons">
  <button class="quick-btn" onclick="addValue(1)">+R$1</button>
  <button class="quick-btn" onclick="addValue(2)">+R$2</button>
  <button class="quick-btn" onclick="addValue(5)">+R$5</button>
  <button class="quick-btn" onclick="addValue(10)">+R$10</button>
  <button class="quick-btn" onclick="addValue(20)">+R$20</button>
  <button class="quick-btn gold" onclick="addValue(50)">+R$50</button>
</div>

<div class="custom-section">
  <h3>💜 Valor Customizado</h3>
  <div class="custom-input-group">
    <input type="number" id="customValue" placeholder="Digite o valor" step="0.01" min="0">
    <button onclick="addCustomValue()">Adicionar</button>
  </div>
</div>

<div class="action-buttons">
  <button class="action-btn reset" onclick="resetValue()">🔄 Zerar</button>
  <button class="action-btn undo" onclick="undoLast()">↩️ Desfazer</button>
</div>

<div class="history-section" id="historySection" style="display:none;">
  <h3>📋 Histórico</h3>
  <div id="historyList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const META_VALUE = 50;
  let currentValue = parseFloat(localStorage.getItem('livepix_current_value')) || 0;
  let history = JSON.parse(localStorage.getItem('livepix_history')) || [];

  const channel = new BroadcastChannel('livepix_meta_channel');

  function formatMoney(value) {
    return value.toFixed(2).replace('.', ',');
  }

  function updateDisplay() {
    document.getElementById('currentDisplay').textContent = formatMoney(currentValue);

    const percent = Math.min((currentValue / META_VALUE) * 100, 100);
    document.getElementById('progressText').textContent = Math.floor(percent) + '%';

    const circumference = 2 * Math.PI * 52;
    const offset = circumference - (percent / 100) * circumference;
    document.getElementById('progressCircle').style.strokeDashoffset = offset;

    // Salvar
    localStorage.setItem('livepix_current_value', currentValue);

    // Notificar overlay
    channel.postMessage({ type: 'update', value: currentValue });

    // Também dispara evento de storage para outras abas
    localStorage.setItem('livepix_update_trigger', Date.now().toString());
  }

  function addValue(amount) {
    history.push({ amount: amount, time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'}) });
    localStorage.setItem('livepix_history', JSON.stringify(history));
    currentValue += amount;
    updateDisplay();
    showToast('+ R$ ' + formatMoney(amount) + ' adicionado! 💜');
    updateHistory();
  }

  function addCustomValue() {
    const input = document.getElementById('customValue');
    const val = parseFloat(input.value);
    if (val && val > 0) {
      addValue(val);
      input.value = '';
    }
  }

  function resetValue() {
    if (confirm('Tem certeza que quer zerar a meta?')) {
      history = [];
      localStorage.setItem('livepix_history', JSON.stringify(history));
      currentValue = 0;
      updateDisplay();
      showToast('Meta zerada! 🔄');
      updateHistory();
    }
  }

  function undoLast() {
    if (history.length > 0) {
      const last = history.pop();
      localStorage.setItem('livepix_history', JSON.stringify(history));
      currentValue = Math.max(0, currentValue - last.amount);
      updateDisplay();
      showToast('Última adição desfeita ↩️');
      updateHistory();
    } else {
      showToast('Nada para desfazer');
    }
  }

  function updateHistory() {
    const section = document.getElementById('historySection');
    const list = document.getElementById('historyList');
    if (history.length === 0) {
      section.style.display = 'none';
      return;
    }
    section.style.display = 'block';
    list.innerHTML = history.slice(-10).reverse().map(h => 
      `<div class="history-item">
        <span class="time">${h.time}</span>
        <span class="amount">+ R$ ${formatMoney(h.amount)}</span>
      </div>`
    ).join('');
  }

  function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // Inicializar
  updateDisplay();
  updateHistory();

  // Enter no input
  document.getElementById('customValue').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') addCustomValue();
  });
</script>

</body>
</html>
