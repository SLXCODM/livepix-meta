<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meta LivePix</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent;font-family:'Nunito',sans-serif;overflow:hidden;width:100vw;height:100vh;display:flex;align-items:flex-end;justify-content:flex-start;padding:20px}
.mc{position:relative;width:380px;background:linear-gradient(145deg,rgba(30,0,60,.92),rgba(60,0,100,.88));border-radius:14px;padding:10px 16px 8px;border:1.5px solid rgba(168,85,247,.5);box-shadow:0 0 15px rgba(168,85,247,.3),0 0 40px rgba(168,85,247,.1),inset 0 0 15px rgba(168,85,247,.08);animation:cp 3s ease-in-out infinite;backdrop-filter:blur(8px);z-index:1}
@keyframes cp{0%,100%{box-shadow:0 0 15px rgba(168,85,247,.3),0 0 40px rgba(168,85,247,.1),inset 0 0 15px rgba(168,85,247,.08)}50%{box-shadow:0 0 22px rgba(168,85,247,.5),0 0 55px rgba(168,85,247,.18),inset 0 0 20px rgba(168,85,247,.12)}}
.mt{color:#fff;font-size:12px;font-weight:900;text-align:center;margin-bottom:5px;text-shadow:0 0 8px rgba(168,85,247,.7);letter-spacing:.3px}
.bw{position:relative;width:100%;height:16px;background:rgba(0,0,0,.35);border-radius:8px;overflow:hidden;border:1px solid rgba(168,85,247,.2)}
.bf{height:100%;background:linear-gradient(90deg,#a855f7,#d946ef,#a855f7);background-size:200% 100%;border-radius:8px;width:0%;transition:width 1s cubic-bezier(.34,1.56,.64,1);position:relative;animation:bs 2s linear infinite;box-shadow:0 0 10px rgba(217,70,239,.4)}
@keyframes bs{0%{background-position:200% 0}100%{background-position:-200% 0}}
.mv{display:flex;justify-content:space-between;margin-top:4px;color:#c084fc;font-size:11px;font-weight:700}
.mc2{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.4);font-size:12px}
.mt2{color:#fbbf24;font-size:12px}
.lp{text-align:center;margin-top:3px;opacity:.3}
.lp a{color:#a78bfa;font-size:9px;text-decoration:none}
.pb{position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:linear-gradient(145deg,#d946ef,#a855f7);color:#fff;font-size:9px;font-weight:900;padding:1px 7px;border-radius:8px;box-shadow:0 0 8px rgba(217,70,239,.4);animation:bp 2s ease-in-out infinite;z-index:10}
@keyframes bp{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
.cs{position:absolute;top:-20px;right:10px;font-size:8px;color:#34d399;opacity:.6}
.cs.off{color:#ef4444}
</style>
</head>
<body>

<div class="mc" id="mc">
  <div class="cs" id="cs">conectando...</div>
  <div class="pb" id="pb">0%</div>
  <div class="mt" id="mt">Essa bala merece seu apoio né?</div>
  <div class="bw"><div class="bf" id="bf"></div></div>
  <div class="mv">
    <span class="mc2">R$ <span id="cv">0,00</span></span>
    <span class="mt2">Meta: R$ 50,00</span>
  </div>
  <div class="lp"><a href="https://livepix.gg/slx" target="_blank">livepix.gg/slx</a></div>
</div>

<script>
const META=50;
const URL="https://cugkhfhjvubkpcatxcal.supabase.co";
const KEY="sb_publishable_omGw32W6HoUkV88hxRHhFA_LHgpYKYc";
let cv=0,pv=0,gr=false;

const headers={
  "apikey":KEY,
  "Authorization":"Bearer "+KEY,
  "Content-Type":"application/json",
  "Prefer":"return=representation"
};

async function init(){
  try{
    // Busca valor inicial
    let r=await fetch(URL+"/rest/v1/meta?id=eq.1&select=valor_atual",{method:"GET",headers:headers});
    let d=await r.json();
    if(d&&d.length>0){
      cv=parseFloat(d[0].valor_atual)||0;
      pv=cv;
      up();
      document.getElementById("cs").textContent="online";
      document.getElementById("cs").classList.remove("off");
    }

    // Polling a cada 2 segundos (substitui o realtime)
    setInterval(async()=>{
      try{
        let r2=await fetch(URL+"/rest/v1/meta?id=eq.1&select=valor_atual",{method:"GET",headers:headers});
        let d2=await r2.json();
        if(d2&&d2.length>0){
          let nv=parseFloat(d2[0].valor_atual)||0;
          if(nv!==cv){
            cv=nv;
            up();
          }
        }
      }catch(e){}
    },2000);

  }catch(e){
    document.getElementById("cs").textContent="offline";
    document.getElementById("cs").classList.add("off");
    console.error(e);
  }
}

function fm(v){return v.toFixed(2).replace(".",",");}

function up(){
  let p=Math.min((cv/META)*100,100);
  document.getElementById("bf").style.width=p+"%";
  document.getElementById("cv").textContent=fm(cv);
  document.getElementById("pb").textContent=Math.floor(p)+"%";
  if(cv>=META&&!gr){gr=true;document.getElementById("mc").style.borderColor="#fbbf24";document.getElementById("mc").style.boxShadow="0 0 30px rgba(251,191,36,.6)";setTimeout(()=>{document.getElementById("mc").style.borderColor="";document.getElementById("mc").style.boxShadow="";gr=false;},3000);}
  pv=cv;
}

init();
</script>

</body>
</html>
